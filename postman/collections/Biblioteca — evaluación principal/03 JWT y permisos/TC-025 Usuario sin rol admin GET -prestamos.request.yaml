$kind: http-request
name: TC-025 Usuario sin rol admin GET /prestamos
description: Usuario sin rol admin GET /prestamos
url: "{{baseUrl}}/prestamos"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenA}}"
scripts:
  - type: afterResponse
    code: |-
      function entity(j){ return j && (j.data || j.usuario || j.libro || j.prestamo || j); }
      function list(j){ const d=j && (j.data || j.libros || j.prestamos || j); return Array.isArray(d)?d:(d && (d.libros || d.prestamos || d.items)); }
      function value(k){ return pm.environment.get(k); }
      function save(k,v){ pm.expect(v, k+" presente").to.not.equal(undefined); pm.environment.set(k,v); }
      let j; try { j=pm.response.json(); } catch(e) { j=null; }

      pm.test("HTTP esperado",()=>pm.expect([403]).to.include(pm.response.code));
    language: text/javascript
order: 11000
