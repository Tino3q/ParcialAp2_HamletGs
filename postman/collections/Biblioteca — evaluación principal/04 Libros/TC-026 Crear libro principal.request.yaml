$kind: http-request
description: Crear libro principal
url: "{{baseUrl}}/libros"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"titulo": "Libro QA {{runId}}", "autor": "Autor QA"}'
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      function entity(j){ return j && (j.data || j.usuario || j.libro || j.prestamo || j); }
      function list(j){ const d=j && (j.data || j.libros || j.prestamos || j); return Array.isArray(d)?d:(d && (d.libros || d.prestamos || d.items)); }
      function value(k){ return pm.environment.get(k); }
      function save(k,v){ pm.expect(v, k+" presente").to.not.equal(undefined); pm.environment.set(k,v); }
      let j; try { j=pm.response.json(); } catch(e) { j=null; }

      pm.test("HTTP esperado",()=>pm.expect([201]).to.include(pm.response.code));
      pm.test("Libro creado disponible",()=>{const b=entity(j); pm.expect(b.disponible).to.equal(true); pm.expect(b.titulo).to.equal('Libro QA '+value('runId')); save('libroId',b.id);});
    language: text/javascript
order: 1000
