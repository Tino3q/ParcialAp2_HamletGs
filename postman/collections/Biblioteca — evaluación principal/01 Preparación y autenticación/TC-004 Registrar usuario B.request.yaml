$kind: http-request
description: Registrar usuario B
url: "{{baseUrl}}/auth/registro"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"nombre": "Usuario B", "email": "{{emailB}}", "password": "{{userPassword}}"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      function entity(j){ return j && (j.data || j.usuario || j.libro || j.prestamo || j); }
      function list(j){ const d=j && (j.data || j.libros || j.prestamos || j); return Array.isArray(d)?d:(d && (d.libros || d.prestamos || d.items)); }
      function value(k){ return pm.environment.get(k); }
      function save(k,v){ pm.expect(v, k+" presente").to.not.equal(undefined); pm.environment.set(k,v); }
      let j; try { j=pm.response.json(); } catch(e) { j=null; }

      pm.test("HTTP esperado",()=>pm.expect([201]).to.include(pm.response.code));
      pm.test("Sin passwords en respuesta",()=>{ function walk(x){ if(x && typeof x==='object'){ Object.keys(x).forEach(k=>{ pm.expect(k.toLowerCase()).to.not.match(/^(password|passwordhash|hashedpassword)$/); walk(x[k]); }); }} walk(j); });
      pm.test("Usuario registrado",()=>{ const u=entity(j); save('usuarioBId',u.id); pm.expect(u.email).to.equal(value('emailB')); if(u.rol!==undefined) pm.expect(u.rol).to.equal('usuario'); });
    language: text/javascript
order: 4000
